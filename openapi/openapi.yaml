    TypeEnum:
      enum:
      - image
      type: string
      description: '* `image` - Image'
    UserMe:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: E-Mail-Adresse
          maxLength: 254
        username:
          type: string
          title: Benutzername
          description: Erforderlich. 30 Zeichen oder weniger. Nur Kleinbuchstaben,
            Zahlen und Unterstriche.
          pattern: ^[a-z0-9_]+$
          maxLength: 30
        first_name:
          type: string
          title: Vorname
          maxLength: 150
        last_name:
          type: string
          title: Nachname
          maxLength: 150
        timezone:
          allOf:
          - $ref: '#/components/schemas/TimezoneEnum'
          title: Zeitzone
        language:
          allOf:
          - $ref: '#/components/schemas/Language1afEnum'
          title: Sprache
          description: |-
            Bevorzugte Sprache für die Benutzeroberfläche

            * `de` - Deutsch
            * `en` - English
        invitation_code:
          type: string
          title: Einladungscode
          description: Persönlicher Einladungscode zum Teilen mit anderen
          maxLength: 20
        users_can_invite:
          type: boolean
          readOnly: true
        urls:
          type: object
          additionalProperties: {}
          readOnly: true
        organizations:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - email
      - organizations
      - urls
      - user_id
      - username
      - users_can_invite
    VisibilityEnum:
      enum:
      - ORG
      - PRIVATE
      - PLATFORM
      - PUBLIC
      type: string
      description: |-
        * `ORG` - Org
        * `PRIVATE` - Private
        * `PLATFORM` - Platform
        * `PUBLIC` - Public
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Personal API token from account settings.
