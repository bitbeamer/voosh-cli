openapi: 3.0.3
info:
  title: voo.sh API
  version: 1.0.0
  description: |-
    Public API for calendars, events, slots, organizations, and bookmarks.

    URL style: API endpoints are canonical without trailing slash.

    Timezone note: For `date-time` inputs, send ISO 8601 values with an explicit offset whenever possible. If no offset is provided, the value is interpreted in the authenticated user's timezone (fallback: UTC). All `date-time` values in responses are returned in UTC with trailing `Z`.
paths:
  /api/v1/bookmarks:
    get:
      operationId: bookmarks_list
      tags:
      - bookmarks
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookmarkList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
      x-required-scopes:
      - calendars:read
  /api/v1/calendars:
    get:
      operationId: calendars_list
      parameters:
      - in: query
        name: calendar_ids
        schema:
          type: string
        description: Optional comma-separated calendar UUID filter.
      - in: query
        name: org
        schema:
          type: string
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - accessible
          - bookmarked
          - favorites
          - managed
          - related
          - sidebar
        description: Filter for calendar list.
      tags:
      - calendars
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCalendarList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
      x-required-scopes:
      - calendars:read
    post:
      operationId: calendars_create
      tags:
      - calendars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalendarWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalendarWrite'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
      x-required-scopes:
      - calendars:write
  /api/v1/calendars/{calendar_id}:
    get:
      operationId: calendars_retrieve
      parameters:
      - in: path
        name: calendar_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days to include for upcoming_events (1-90, default
          7). Only valid when include=upcoming_events is set.
      - in: query
        name: include
        schema:
          type: string
          enum:
          - upcoming_events
        description: 'Optional expansions. Supported: upcoming_events.'
      tags:
      - calendars
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
      x-required-scopes:
      - calendars:read
      x-conditional-scopes:
        include_upcoming_events:
        - events:read
    patch:
